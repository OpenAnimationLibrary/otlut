name: Publish paired-image alpha release

on:
  push:
    branches:
      - release/otlut-alpha-2026-10-03
    paths:
      - ".github/workflows/release_pair_alpha.yml"
      - "release-notes/otlut-alpha-2026-10-03.md"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Check out otlut
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify paired-image CLI exists
        shell: pwsh
        run: |
          $help = & "build/Release/otlut.exe" --help
          $help | Out-String | Write-Host
          if (($help | Out-String) -notmatch "--source") { throw "Built otlut.exe does not expose --source" }
          if (($help | Out-String) -notmatch "--target") { throw "Built otlut.exe does not expose --target" }

      - name: Package
        shell: pwsh
        run: |
          $tag = "otlut-alpha-2026-10-03"
          $package = Join-Path $PWD "package"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "build/Release/otlut.exe" $package
          Copy-Item "README.md" $package
          Copy-Item "LICENSE" $package
          Copy-Item "docs/FORMAT_COMPATIBILITY.md" $package
          & "$package/otlut.exe" --identity --output "$package/identity-33.cube" --size 33
          & "$package/otlut.exe" --identity --output "$package/identity-33.3dl" --size 33 --output-bit-depth 12
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$package/*" -DestinationPath "dist/$tag-windows-x64.zip" -Force

      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "otlut-alpha-2026-10-03" "dist/otlut-alpha-2026-10-03-windows-x64.zip" --repo "${{ github.repository }}" --target "abb684e8af7c1ed712eaed6b5ac986d5af039999" --title "OTLUT Alpha - 2026-10-03" --notes-file "release-notes/otlut-alpha-2026-10-03.md" --prerelease
