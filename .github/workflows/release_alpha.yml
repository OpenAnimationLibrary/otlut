name: Publish alpha release

on:
  push:
    branches:
      - docs/initial-project-plan
    paths:
      - ".github/workflows/release_alpha.yml"
      - "release-notes/otlut-alpha-2026-10-02.md"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Check out otlut
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $tag = "otlut-alpha-2026-10-02"
          $package = Join-Path $PWD "package"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "build/Release/otlut.exe" $package
          Copy-Item "README.md" $package
          Copy-Item "LICENSE" $package
          Copy-Item "docs/FORMAT_COMPATIBILITY.md" $package
          & "$package/otlut.exe" --identity --output "$package/identity-33.cube" --size 33
          & "$package/otlut.exe" --identity --output "$package/identity-33.3dl" --size 33 --output-bit-depth 12
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$package/*" -DestinationPath "dist/$tag-windows-x64.zip" -Force

      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "otlut-alpha-2026-10-02" "dist/otlut-alpha-2026-10-02-windows-x64.zip" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "otlut Alpha - 2026-10-02" --notes-file "release-notes/otlut-alpha-2026-10-02.md" --prerelease
